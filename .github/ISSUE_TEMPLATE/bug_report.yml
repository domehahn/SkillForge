name: Bug report
description: Report a reproducible problem in SkillForge.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Share only information that is safe to publish. Redact tokens, credentials,
        private URLs, and user data from logs and examples.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable set of steps.
      placeholder: |
        1. Start the registry with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SkillForge version or commit
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Relevant context
      description: Add sanitized logs, configuration excerpts, or screenshots.
    validations:
      required: false
