name: integration-tests

on:
  push:
    branches: [main]
    paths:
      - 'skill-registry/**'
      - 'sklib/**'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    paths:
      - 'skill-registry/**'
      - 'sklib/**'
      - '.github/workflows/integration-tests.yml'
  workflow_dispatch:

jobs:
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: off
      CGO_ENABLED: "1"
      SKILLFORGE_E2E_BASE_URL: http://localhost:8082

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: skill-registry/go.mod
          cache-dependency-path: skill-registry/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: skill-registry/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get install -y gcc libsqlite3-dev

      - name: Build skill-registry binary
        working-directory: skill-registry
        run: |
          mkdir -p bin
          go build -o bin/skill-registry ./cmd/skill-registry

      - name: Build web UI
        working-directory: skill-registry/web
        run: |
          npm ci
          npm run build

      - name: Install Playwright browsers
        working-directory: skill-registry
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start skill-registry server
        working-directory: skill-registry
        run: |
          # Create data directories
          mkdir -p test-data
          
          # Create minimal config for testing
          cat > test-config.yaml <<EOF
          server:
            port: 8082
            host: localhost
          storage:
            type: filesystem
            path: ./test-data
          database:
            type: sqlite
            path: ./test-data/test.db
          auth:
            enabled: false
          EOF

          # Start server in background
          ./bin/skill-registry -config test-config.yaml &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # Wait for server to be ready
          timeout 30 sh -c 'until curl -s http://localhost:8082/healthz > /dev/null; do sleep 1; done'
          echo "Server is ready"

      - name: Run Playwright tests
        working-directory: skill-registry
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            skill-registry/test-results/
            skill-registry/playwright-report/
          retention-days: 7

      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi
