name: pr-checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: PR Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better commit analysis

      - name: Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          
          # Check for conventional commit format (optional but recommended)
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'; then
            echo "::warning::PR title doesn't follow conventional commit format"
            echo "::warning::Recommended format: type(scope): description"
            echo "::warning::Example: feat(api): add new endpoint for skill validation"
          fi

      - name: Check for merge conflicts
        run: |
          git fetch origin ${{ github.base_ref }}
          if git merge-tree $(git merge-base HEAD origin/${{ github.base_ref }}) HEAD origin/${{ github.base_ref }} | grep -q '<<<<<<<'; then
            echo "::error::This PR has merge conflicts that need to be resolved"
            exit 1
          fi

      - name: Validate commit messages
        run: |
          COMMITS=$(git log origin/${{ github.base_ref }}..HEAD --pretty=format:%s)
          echo "Commits in this PR:"
          echo "$COMMITS"
          
          # Check for common issues
          if echo "$COMMITS" | grep -qi 'wip\|fixup\|squash me'; then
            echo "::warning::Found WIP or fixup commits - consider squashing before merge"
          fi

      - name: Check file size limits
        run: |
          LARGE_FILES=$(git diff --name-only origin/${{ github.base_ref }}..HEAD | while read file; do
            if [ -f "$file" ]; then
              size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null || echo 0)
              if [ "$size" -gt 1048576 ]; then  # 1MB
                echo "$file ($(numfmt --to=iec-i --suffix=B $size 2>/dev/null || echo $size bytes))"
              fi
            fi
          done)
          
          if [ -n "$LARGE_FILES" ]; then
            echo "::warning::Large files detected (>1MB):"
            echo "$LARGE_FILES"
            echo "::warning::Consider using Git LFS for large binary files"
          fi

      - name: Check for sensitive data patterns
        run: |
          # Check for common patterns that might indicate secrets
          PATTERNS=(
            'password.*=.*["\047][^"\047]{8,}'
            'api[_-]?key.*=.*["\047][^"\047]{16,}'
            'secret.*=.*["\047][^"\047]{16,}'
            'token.*=.*["\047][^"\047]{16,}'
            'private[_-]?key'
            'BEGIN.*PRIVATE.*KEY'
          )
          
          FOUND=false
          for pattern in "${PATTERNS[@]}"; do
            if git diff origin/${{ github.base_ref }}..HEAD | grep -iE "$pattern" | grep -v '^-'; then
              FOUND=true
            fi
          done
          
          if [ "$FOUND" = true ]; then
            echo "::warning::Potential sensitive data patterns detected"
            echo "::warning::Please review the changes carefully"
          fi

  summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    steps:
      - name: Comment PR summary
        if: github.event.action == 'opened'
        uses: actions/github-script@v9
        with:
          script: |
            const body = `## PR Checks Summary

            ✅ Basic validation completed

            ### Next Steps
            - [ ] All CI checks must pass
            - [ ] Code review required
            - [ ] Update documentation if needed
            - [ ] Add/update tests for new functionality

            ### Reminder
            - Ensure your branch is up to date with \`${{ github.base_ref }}\`
            - Follow the [conventional commit](https://www.conventionalcommits.org/) format
            - Add meaningful descriptions to your commits`;

            if (github.event.pull_request.draft) {
              return;  // Skip comment for draft PRs
            }

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
