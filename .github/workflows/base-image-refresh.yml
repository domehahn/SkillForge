name: base-image-refresh

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  scan:
    name: Rebuild and scan for CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no-cache to pull latest base layers)
        run: |
          docker build \
            --no-cache \
            --file SkillForge/skill-registry/Dockerfile \
            --tag skill-registry:refresh \
            .

      - name: Run Trivy vulnerability scan
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH skill-registry:refresh

      - name: Open issue on scan failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[Security] Base image CVEs found - ${new Date().toISOString().split('T')[0]}`;
            const body = [
              '## Automated base-image vulnerability scan failed',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Trivy found unfixed CRITICAL or HIGH CVEs in the current base images.',
              'Update the `FROM` lines in `skill-registry/Dockerfile` to a newer patch release and re-run.',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,base-image',
            });

            if (!issues.find(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'base-image'],
              });
            }
