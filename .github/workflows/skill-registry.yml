name: skill-registry

on:
  push:
    branches: [main]
  pull_request: {}

# No path filters, deliberately: this workflow's jobs (test, build-image) are
# used as required branch-protection status checks for main. A path-filtered
# required check never gets reported for a PR that doesn't touch the
# filtered paths, which GitHub then shows as permanently "Expected —
# waiting for status to be reported" — silently blocking merge forever
# instead of just skipping. Always running is the safe default for anything
# required; scope narrowing belongs to jobs that are *not* required checks
# (see integration-tests.yml).

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skill-registry
    env:
      GOWORK: off
      CGO_ENABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: skill-registry/go.mod
          cache-dependency-path: skill-registry/go.sum

      - name: Install system dependencies
        run: sudo apt-get install -y gcc libsqlite3-dev

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  build-image:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --file skill-registry/Dockerfile \
            --tag skill-registry:ci \
            .

      - name: Smoke test
        run: |
          docker run --rm -d \
            --name skill-registry-ci \
            -p 18080:8080 \
            -e SKILL_REGISTRY_AUTH_ENABLED=false \
            skill-registry:ci
          sleep 3
          curl --fail http://localhost:18080/healthz
          curl --fail http://localhost:18080/readyz
          docker stop skill-registry-ci

      - name: Scan image for vulnerabilities
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH skill-registry:ci
