name: skill-registry

on:
  push:
    branches: [main]
  pull_request: {}

# No path filters, deliberately: this workflow's jobs (test, build-image) are
# used as required branch-protection status checks for main. A path-filtered
# required check never gets reported for a PR that doesn't touch the
# filtered paths, which GitHub then shows as permanently "Expected —
# waiting for status to be reported" — silently blocking merge forever
# instead of just skipping. Always running is the safe default for anything
# required; scope narrowing belongs to jobs that are *not* required checks
# (see integration-tests.yml).

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skill-registry
    env:
      GOWORK: off
      CGO_ENABLED: "1"

    steps:
      - uses: actions/checkout@11d5960a555e9f5067d0080324757d54805c85ce # v4.2.2

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: skill-registry/go.mod
          cache-dependency-path: skill-registry/go.sum

      - name: Install system dependencies
        run: sudo apt-get install -y gcc libsqlite3-dev

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
          staticcheck ./...

  build-image:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a555e9f5067d0080324757d54805c85ce # v4.2.2

      - name: Build Docker image
        run: |
          docker build \
            --file skill-registry/Dockerfile \
            --tag skill-registry:ci \
            .

      - name: Smoke test
        run: |
          docker run --rm -d \
            --name skill-registry-ci \
            -p 18080:8080 \
            -e SKILL_REGISTRY_AUTH_ENABLED=false \
            skill-registry:ci
          sleep 3
          curl --fail http://localhost:18080/healthz
          curl --fail http://localhost:18080/readyz
          docker stop skill-registry-ci

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394d2dd8c87dbb9 # v0.29.0
        with:
          image-ref: 'skill-registry:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
