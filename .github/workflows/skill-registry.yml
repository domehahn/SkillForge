name: skill-registry

on:
  push:
    branches: [main]
  pull_request: {}

# No path filters, deliberately: this workflow's jobs (test, build-image) are
# used as required branch-protection status checks for main. A path-filtered
# required check never gets reported for a PR that doesn't touch the
# filtered paths, which GitHub then shows as permanently "Expected —
# waiting for status to be reported" — silently blocking merge forever
# instead of just skipping. Always running is the safe default for anything
# required; scope narrowing belongs to jobs that are *not* required checks
# (see integration-tests.yml).

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skill-registry
    env:
      GOWORK: off
      CGO_ENABLED: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: skill-registry/go.mod
          cache-dependency-path: skill-registry/go.sum

      - name: Install system dependencies
        run: sudo apt-get install -y gcc libsqlite3-dev

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...

  build-image:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Build Docker image
        run: |
          docker build \
            --file skill-registry/Dockerfile \
            --tag skill-registry:ci \
            .

      - name: Smoke test
        run: |
          docker run --rm -d \
            --name skill-registry-ci \
            -p 18080:8080 \
            -e SKILL_REGISTRY_AUTH_ENABLED=false \
            skill-registry:ci
          sleep 3
          curl --fail http://localhost:18080/healthz
          curl --fail http://localhost:18080/readyz
          docker stop skill-registry-ci

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'skill-registry:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
