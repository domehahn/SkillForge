name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write  # required for keyless cosign signing

jobs:
  test:
    name: Run verification & security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: skill-registry/go.mod
          cache-dependency-path: skill-registry/go.sum

      - name: Install dependencies & sqlite3 dev headers
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev

      - name: Run unit & race tests
        working-directory: skill-registry
        run: go test -v -race ./...

      - name: Run HA multi-replica consistency test
        working-directory: skill-registry
        run: go test -v ./tests -run TestHA_MultiReplicaConsistency

      - name: Run Backup & Restore full lifecycle test
        working-directory: skill-registry
        run: go test -v ./tests -run TestBackupAndRestore_FullLifecycle

  build:
    name: Build binaries
    needs: test
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: off
      CGO_ENABLED: "1"
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
          - os: macos-latest
            goos: darwin
            goarch: amd64
            cc: clang
          - os: macos-latest
            goos: darwin
            goarch: arm64
            cc: clang
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
            ext: .exe

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: skill-registry/go.mod
          cache-dependency-path: skill-registry/go.sum

      - name: Install Linux cross-compile toolchains
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev \
            gcc-aarch64-linux-gnu \
            gcc-mingw-w64-x86-64

      - name: Build skill-registry
        working-directory: skill-registry
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc || 'gcc' }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
            -o ../dist/skill-registry-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/skill-registry

      - name: Build skforge
        working-directory: skill-registry
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc || 'gcc' }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
            -o ../dist/skforge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/skforge

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: dist/
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe0f2afb377e8e9b698fd7e4ab0f39d1956ec # v2.0.9
        with:
          generate_release_notes: true
          files: |
            dist/*

  docker:
    name: Docker image & provenance
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.8.0

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v6.13.0
        with:
          context: .
          file: skill-registry/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/skill-registry:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/skill-registry:latest

      - name: Install cosign
        uses: sigstore/cosign-installer@d7ac0a4a31d78d123e257a927022e0787e91400d # v3.8.0

      - name: Sign image
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/skill-registry@${{ steps.build-push.outputs.digest }}

      - name: Generate SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.19.0
          syft ghcr.io/${{ github.repository_owner }}/skill-registry:${{ github.ref_name }} \
            -o spdx-json \
            --file sbom-${{ github.ref_name }}.spdx.json

      - name: Attach SBOM to release
        uses: softprops/action-gh-release@c95fe0f2afb377e8e9b698fd7e4ab0f39d1956ec # v2.0.9
        with:
          files: sbom-${{ github.ref_name }}.spdx.json
