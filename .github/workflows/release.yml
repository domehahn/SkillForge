name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write  # required for keyless cosign signing

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    env:
      GOWORK: off
      CGO_ENABLED: "1"
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
          - goos: darwin
            goarch: amd64
            cc: o64-clang
          - goos: darwin
            goarch: arm64
            cc: oa64-clang
          - goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: skill-registry/go.mod
          cache-dependency-path: skill-registry/go.sum

      - name: Install cross-compile toolchains
        run: |
          sudo apt-get install -y gcc libsqlite3-dev \
            gcc-aarch64-linux-gnu \
            gcc-mingw-w64-x86-64

      - name: Build skill-registry
        working-directory: skill-registry
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc || 'gcc' }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
            -o ../dist/skill-registry-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/skill-registry

      - name: Build skforge
        working-directory: skill-registry
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc || 'gcc' }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
            -o ../dist/skforge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/skforge

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: SkillForge/skill-registry/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/skill-registry:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/skill-registry:latest

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/skill-registry@${{ steps.build-push.outputs.digest }}

      - name: Generate SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft ghcr.io/${{ github.repository_owner }}/skill-registry:${{ github.ref_name }} \
            -o spdx-json \
            --file sbom-${{ github.ref_name }}.spdx.json

      - name: Attach SBOM to release
        uses: softprops/action-gh-release@v2
        with:
          files: sbom-${{ github.ref_name }}.spdx.json
