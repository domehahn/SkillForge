apiVersion: skillforge.dev/v1
kind: flow
metadata:
  namespace: demo
  name: review-flow
  version: 1.0.0
  description: A reusable document review flow.
  tags: [flow, review]
spec:
  entrypoint: FLOW.yaml
  dependencies:
