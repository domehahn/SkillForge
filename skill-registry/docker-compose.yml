version: '3.8'

services:
  registry:
    build: .
    image: skill-registry:latest
    container_name: skill-registry
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - SKILL_REGISTRY_ADDR=:8080
      - SKILL_REGISTRY_DATA_DIR=/app/data
      - SKILL_REGISTRY_DB_PATH=/app/data/registry.db
      - SKILL_REGISTRY_AUTH_ENABLED=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
