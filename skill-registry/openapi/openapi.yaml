openapi: 3.0.3
info:
  title: Skill Registry API
  description: API for managing AI Agent Skills
  version: 1.0.0
  contact:
    name: SkillForge Team
    email: team@skillforge.dev

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthCheck
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      summary: Readiness check
      operationId: readyCheck
      tags:
        - Health
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready

  /api/v1/metadata:
    get:
      summary: Get registry metadata
      operationId: getMetadata
      tags:
        - Registry
      responses:
        '200':
          description: Registry metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryMetadata'

  /api/v1/skills:
    get:
      summary: List skills
      operationId: listSkills
      tags:
        - Skills
      parameters:
        - name: q
          in: query
          description: Search query
          schema:
            type: string
        - name: namespace
          in: query
          description: Filter by namespace
          schema:
            type: string
        - name: tag
          in: query
          description: Filter by tag
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Offset for pagination
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: List of skills
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillList'

  /api/v1/skills/{namespace}/{name}:
    get:
      summary: Get skill details
      operationId: getSkill
      tags:
        - Skills
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Skill details with versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill:
                    $ref: '#/components/schemas/Skill'
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SkillVersion'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/skills/{namespace}/{name}/versions/{version}:
    get:
      summary: Get version details
      operationId: getVersion
      tags:
        - Versions
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
          description: Version number or 'latest'
      responses:
        '200':
          description: Version details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillVersion'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Publish skill version
      operationId: publishVersion
      tags:
        - Versions
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
        - name: force
          in: query
          description: Force overwrite existing version
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/gzip:
            schema:
              type: string
              format: binary
          application/zip:
            schema:
              type: string
              format: binary
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Version published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      summary: Delete skill version
      operationId: deleteVersion
      tags:
        - Versions
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Version deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/skills/{namespace}/{name}/versions/{version}/download:
    get:
      summary: Download skill package
      operationId: downloadVersion
      tags:
        - Versions
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Package file
          headers:
            X-Skill-Digest-SHA256:
              schema:
                type: string
              description: SHA-256 digest of the package
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/validate:
    post:
      summary: Validate skill package
      operationId: validatePackage
      tags:
        - Validation
      requestBody:
        required: true
        content:
          application/gzip:
            schema:
              type: string
              format: binary
          application/zip:
            schema:
              type: string
              format: binary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token

  schemas:
    RegistryMetadata:
      type: object
      properties:
        name:
          type: string
          example: Skill Registry
        version:
          type: string
          example: 1.0.0
        supported_package_types:
          type: array
          items:
            type: string
          example: [tgz, zip]
        auth_mode:
          type: string
          enum: [disabled, token]
        capabilities:
          type: array
          items:
            type: string
          example: [publish, list, download, validate, delete]

    Skill:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        namespace:
          type: string
        description:
          type: string
        latest_version:
          type: string
        visibility:
          type: string
          enum: [public, private, internal]
        tags:
          type: array
          items:
            type: string
        owners:
          type: array
          items:
            type: string
        deprecated:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SkillVersion:
      type: object
      properties:
        id:
          type: integer
          format: int64
        skill_id:
          type: integer
          format: int64
        name:
          type: string
        namespace:
          type: string
        version:
          type: string
        description:
          type: string
        digest_sha256:
          type: string
        package_type:
          type: string
          enum: [zip, tgz]
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        entrypoint_path:
          type: string
        validation_status:
          type: string
        source:
          type: string
        deprecated:
          type: boolean

    SkillList:
      type: object
      properties:
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        metadata:
          type: object

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
