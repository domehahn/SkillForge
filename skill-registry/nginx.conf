worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_types application/json application/yaml text/plain text/css application/javascript;
    gzip_min_length 1024;

    upstream registry {
        server registry:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Large uploads (skill packages up to 50 MB + overhead)
        client_max_body_size 60M;

        # Longer timeouts for package uploads/downloads
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;

        # Forward real client IP
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;

        # Cache static assets (Vite hashed filenames)
        location /assets/ {
            proxy_pass http://registry;
            add_header Cache-Control "public, immutable, max-age=31536000";
        }

        # Everything else to registry
        location / {
            proxy_pass http://registry;
        }
    }
}
