services:
  postgres:
    image: postgres:16-alpine
    container_name: skill-registry-ha-postgres
    environment:
      POSTGRES_DB: skillforge
      POSTGRES_USER: skillforge
      POSTGRES_PASSWORD: skillforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-ha-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillforge -d skillforge"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: skill-registry-ha-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-ha-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio-create-bucket:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: skill-registry-ha-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb myminio/skillforge-blobs --ignore-existing;
      exit 0;
      "

  redis:
    image: redis:7-alpine
    container_name: skill-registry-ha-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  replica1:
    build:
      context: ..
      dockerfile: skill-registry/Dockerfile
    image: skill-registry:latest
    container_name: skill-registry-replica-1
    expose:
      - "8080"
    environment:
      - SKILL_REGISTRY_ADDR=:8080
      - SKILL_REGISTRY_DB_DRIVER=postgres
      - SKILL_REGISTRY_DB_DSN=postgres://skillforge:skillforge@postgres:5432/skillforge?sslmode=disable
      - SKILL_REGISTRY_STORAGE_BACKEND=s3
      - SKILL_REGISTRY_STORAGE_S3_ENDPOINT=minio:9000
      - SKILL_REGISTRY_STORAGE_S3_REGION=us-east-1
      - SKILL_REGISTRY_STORAGE_S3_BUCKET=skillforge-blobs
      - SKILL_REGISTRY_STORAGE_S3_ACCESS_KEY=minioadmin
      - SKILL_REGISTRY_STORAGE_S3_SECRET_KEY=minioadminpassword
      - SKILL_REGISTRY_STORAGE_S3_USE_SSL=false
      - SKILL_REGISTRY_STORAGE_S3_PATH_STYLE=true
      - SKILL_REGISTRY_RATE_LIMIT_BACKEND=redis
      - SKILL_REGISTRY_RATE_LIMIT_REDIS_ADDR=redis:6379
      - SKILL_REGISTRY_AUTH_ENABLED=true
      - SKILL_REGISTRY_PRODUCTION_MODE=true
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

  replica2:
    build:
      context: ..
      dockerfile: skill-registry/Dockerfile
    image: skill-registry:latest
    container_name: skill-registry-replica-2
    expose:
      - "8080"
    environment:
      - SKILL_REGISTRY_ADDR=:8080
      - SKILL_REGISTRY_DB_DRIVER=postgres
      - SKILL_REGISTRY_DB_DSN=postgres://skillforge:skillforge@postgres:5432/skillforge?sslmode=disable
      - SKILL_REGISTRY_STORAGE_BACKEND=s3
      - SKILL_REGISTRY_STORAGE_S3_ENDPOINT=minio:9000
      - SKILL_REGISTRY_STORAGE_S3_REGION=us-east-1
      - SKILL_REGISTRY_STORAGE_S3_BUCKET=skillforge-blobs
      - SKILL_REGISTRY_STORAGE_S3_ACCESS_KEY=minioadmin
      - SKILL_REGISTRY_STORAGE_S3_SECRET_KEY=minioadminpassword
      - SKILL_REGISTRY_STORAGE_S3_USE_SSL=false
      - SKILL_REGISTRY_STORAGE_S3_PATH_STYLE=true
      - SKILL_REGISTRY_RATE_LIMIT_BACKEND=redis
      - SKILL_REGISTRY_RATE_LIMIT_REDIS_ADDR=redis:6379
      - SKILL_REGISTRY_AUTH_ENABLED=true
      - SKILL_REGISTRY_PRODUCTION_MODE=true
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.25-alpine
    container_name: skill-registry-ha-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      replica1:
        condition: service_healthy
      replica2:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-ha-data:
    driver: local
  minio-ha-data:
    driver: local
